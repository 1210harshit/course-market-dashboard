/* Layout: BI report shell. Dark title bar + page tabs, slicer pane on the left, card canvas on the right.
   Single light theme on purpose (report canvas), every colour set explicitly. */
:root {
  --navy: #0f327e; --deep: #0c2253; --klein: #002fa7; --blue: #1976d2; --sky: #25a8d9; --cyan: #4dd1f4; --pale: #9ae1f8;
  --teal: #1f9e8f; --slate: #3d4d70; --grey: #8790a6; --mist: #e7e9ed; --off: #fcfff4; --orange: #e96f12; --red: #c53f3f;
  --canvas: #eef1f6; --card: #ffffff; --line: #dfe3ea; --text: #1d2a44; --muted: #6b7489;
  --font: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; background: var(--canvas); color: var(--text); font: 13px/1.4 var(--font) }
button { font: inherit; cursor: pointer }
a { color: var(--blue); text-decoration: none } a:hover { text-decoration: underline }
.num { font-variant-numeric: tabular-nums }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px }

.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; min-height: 0 }
.titlebar { background: var(--deep); color: var(--off); display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)) }
.titlebar .logo { width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, var(--sky), var(--blue)); display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 13px; flex: none }
.titlebar h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .01em }
.weekpick { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #b9c6e4; margin-left: 16px }
.weekpick select { font: inherit; font-size: 13px; font-weight: 600; color: #0c2253; background: #fcfff4; border: 0; border-radius: 4px; padding: 4px 8px }
.banner { grid-column: span 12; background: #fff7ed; border: 1px solid #f6c9a6; border-radius: 4px; padding: 10px 12px; font-size: 13px; color: #3d4d70; line-height: 1.5 }
.banner b { color: #0c2253 }
.up { color: #1f9e8f; font-weight: 600 } .down { color: #c53f3f; font-weight: 600 }
.titlebar .meta { margin-left: auto; font-size: 11px; color: #b9c6e4; text-align: right }
.titlebar .filt-btn { display: none; border: 1px solid #3b5590; background: transparent; color: var(--off); border-radius: 4px; padding: 5px 10px; font-size: 12px }
.pages { background: #fff; border-bottom: 1px solid var(--line); display: flex; gap: 2px; padding: 0 12px; overflow-x: auto }
.pages button { border: 0; background: transparent; padding: 10px 14px 8px; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap }
.pages button[aria-selected=true] { color: var(--navy); border-bottom-color: var(--orange) }
.pages button:hover { color: var(--navy) }
.pages .sep { align-self: center; color: var(--muted); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 0 6px 0 12px; margin-left: 8px; border-left: 1px solid var(--line); white-space: nowrap }
.pages button.det { font-weight: 500 }
.find { margin: 6px 0 2px; padding-left: 20px; font-size: 13.5px; line-height: 1.65; color: var(--slate) }
.find b { color: var(--navy) }
.mp { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600 }
.mp-3 { background: #dff3ee; color: #136e63 } .mp-2 { background: #e3eefb; color: #164f94 } .mp-1 { background: #eef0f4; color: #5b6478 }
details.adv > summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--navy); padding: 2px 0; list-style-position: inside }
details.adv[open] > summary { margin-bottom: 8px }
.qdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0 }

.body { display: grid; grid-template-columns: 250px 1fr; min-height: 0 }
.slicers { background: #fff; border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 12px 24px; display: flex; flex-direction: column; gap: 14px }
.slicers .head { display: flex; justify-content: space-between; align-items: center }
.slicers .head b { font-size: 13px; color: var(--navy) }
.clear { border: 1px solid var(--line); background: #fff; color: var(--blue); border-radius: 4px; padding: 3px 8px; font-size: 12px }
.slicer h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; font-weight: 700 }
.slicer h3 button { border: 0; background: none; color: var(--blue); font-size: 11px; text-transform: none; letter-spacing: 0; padding: 0 }
.chips { display: flex; flex-wrap: wrap; gap: 4px }
.chip { border: 1px solid var(--line); background: #f7f8fb; color: var(--text); border-radius: 3px; padding: 3px 7px; font-size: 12px }
.chip[aria-pressed=true] { background: var(--navy); border-color: var(--navy); color: #fff }
.list { max-height: 210px; overflow-y: auto; border: 1px solid var(--line); border-radius: 3px }
.list label { display: flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer }
.list label:hover { background: #f2f5fa }
.list label small { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums }
.list input { accent-color: var(--navy); margin: 0 }
.search { width: 100%; border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; font: inherit; margin-bottom: 4px }
.active { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px }
.active b { color: var(--text) }

.canvas { overflow-y: auto; padding: 12px; min-width: 0 }
.page { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-content: start }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 1px 2px rgba(12, 34, 83, .05); padding: 10px 12px; min-width: 0; display: flex; flex-direction: column }
.card h2 { font-size: 13px; margin: 0; color: var(--text); font-weight: 600 }
.card .sub { font-size: 11px; color: var(--muted); margin: 1px 0 4px }
.card .chart { flex: 1; min-height: 260px; width: 100% }
.card.tall .chart { min-height: 380px }
.card.xtall .chart { min-height: 520px }
.s12 { grid-column: span 12 } .s8 { grid-column: span 8 } .s7 { grid-column: span 7 } .s6 { grid-column: span 6 } .s5 { grid-column: span 5 } .s4 { grid-column: span 4 } .s3 { grid-column: span 3 }
.kpis { grid-column: span 12; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; border-top: 3px solid var(--blue) }
.kpi .v { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.kpi .v.txt { font-size: 15px; white-space: normal; line-height: 1.25; padding-top: 3px }
.kpi .l { font-size: 11px; color: var(--muted); margin-top: 2px }
.kpi.acc { border-top-color: var(--orange) }
.tbl-wrap { overflow: auto; max-height: 520px; border-top: 1px solid var(--line); margin-top: 4px }
table { border-collapse: collapse; width: 100%; font-size: 12px }
th { position: sticky; top: 0; background: #f4f6fa; text-align: left; font-weight: 600; color: var(--slate); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; z-index: 1 }
th.r, td.r { text-align: right }
th.on::after { content: " ▾"; color: var(--orange) }
th.on.asc::after { content: " ▴" }
td { padding: 5px 8px; border-bottom: 1px solid #eef0f4; white-space: nowrap; font-variant-numeric: tabular-nums }
td.t { white-space: normal; min-width: 240px; max-width: 420px }
tr.click { cursor: pointer }
tr.click:hover td { background: #f2f6fd }
tr.sel td { background: #e5eefc }
.bar { position: relative }
.bar i { position: absolute; left: 0; top: 3px; bottom: 3px; background: #d6e6fb; border-radius: 2px; z-index: 0 }
.bar span { position: relative; z-index: 1 }
.ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 6px }
.ctrl select { font: inherit; border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; background: #fff; color: var(--text) }
.ctrl label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center }
.fastgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px 20px; margin-top: 6px }
.fastgrid h3 { font-size: 13px; margin: 0 0 4px; color: var(--navy) }
.fastgrid ol { margin: 0; padding-left: 20px; font-size: 12px }
.fastgrid li { padding: 2px 0; display: flex; justify-content: space-between; gap: 8px }
.fastgrid li span { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap }
.note { font-size: 12px; color: var(--muted); line-height: 1.5 }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px 24px; font-size: 13px; line-height: 1.55 }
.notes h3 { font-size: 13px; margin: 0 0 4px; color: var(--navy) }
.notes p { margin: 0 0 8px; color: var(--slate) }
.empty { color: var(--muted); padding: 20px 0; text-align: center }
.scrim { display: none }

@media (max-width: 900px) {
  .body { grid-template-columns: 1fr }

  .titlebar .meta { display: none }
  .s8, .s7, .s6, .s5, .s4, .s3 { grid-column: span 12 }
}
@media (prefers-reduced-motion: reduce) { .slicers { transition: none } }

      : { type: 'scroll', orient: 'vertical', right: 0, top: 'middle', textStyle: { fontSize: 11, color: '#3d4d70' }, itemWidth: 10, itemHeight: 10, formatter: n => n.length > 22 ? n.slice(0, 21) + '…' : n },
    series: [{ type: 'pie', radius: narrow ? ['40%', '64%'] : ['48%', '74%'], center: narrow ? ['50%', '40%'] : ['34%', '50%'], avoidLabelOverlap: true, label: { show: true, position: 'inside', formatter: p => p.percent >= 6 ? Math.round(p.percent) + '%' : '', color: '#fff', fontSize: 11, fontWeight: 600 }, data }],
  }, true);

}
function mix(a, b, t) { const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16)); return '#' + pa.map((x, i) => Math.round(x + (pb[i] - x) * t).toString(16).padStart(2, '0')).join(''); }

// sortable table
const tblSort = {};
function table(id, cols, data, { key, sortK, onPick, selFn, limit = 500 } = {}) {
  const el = document.getElementById(id); if (!el) return;
  const st = tblSort[id] || (tblSort[id] = { k: sortK || cols[1].k, asc: false });
  const col = cols.find(c => c.k === st.k) || cols[0];
  const val = r => col.v ? col.v(r) : r[col.k];
  data = data.slice().sort((a, b) => { const x = val(a), y = val(b); if (x == null) return 1; if (y == null) return -1; return typeof x === 'string' ? (st.asc ? y.localeCompare(x) : x.localeCompare(y)) : (st.asc ? x - y : y - x); });
  const maxes = {}; cols.filter(c => c.bar).forEach(c => maxes[c.k] = Math.max(...data.map(r => (c.v ? c.v(r) : r[c.k]) || 0)));
  el.innerHTML = `<table><thead><tr>${cols.map(c => `<th class="${c.r ? 'r' : ''} ${c.k === col.k ? 'on' + (st.asc ? ' asc' : '') : ''}" data-k="${c.k}">${c.label}</th>`).join('')}</tr></thead><tbody>${
    data.slice(0, limit).map(r => `<tr class="${onPick ? 'click' : ''} ${selFn && selFn(r) ? 'sel' : ''}" ${key ? `data-key="${key(r)}"` : ''}>${cols.map(c => {
      const v = c.v ? c.v(r) : r[c.k], txt = c.f ? c.f(r) : esc(v ?? '–');
      if (c.bar && v) return `<td class="r bar"><i style="width:${Math.max(2, v / maxes[c.k] * 100)}%"></i><span>${txt}</span></td>`;
      return `<td class="${c.r ? 'r' : ''} ${c.t ? 't' : ''}">${txt}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table>${data.length ? '' : '<div class="empty">No rows for this selection.</div>'}`;
  el.querySelector('thead').onclick = e => { const th = e.target.closest('th'); if (!th) return; if (st.k === th.dataset.k) st.asc = !st.asc; else { st.k = th.dataset.k; st.asc = false; } table(id, cols, data, { key, sortK, onPick, selFn, limit }); };
  if (onPick) el.querySelector('tbody').onclick = e => { const tr = e.target.closest('tr[data-key]'); if (tr && !e.target.closest('a')) onPick(tr.dataset.key); };
}
function kpis(id, list) { const el = document.getElementById(id); if (!el) return; el.innerHTML = list.map(([v, l, acc]) => `<div class="kpi ${acc ? 'acc' : ''}"><div class="v ${/^[\d$.,%KMB\s–+\/-]+$/.test(String(v).replace(/<[^>]+>/g, '')) ? '' : 'txt'}" title="${esc(String(v).replace(/<[^>]+>/g, ''))}">${v}</div><div class="l">${l}</div></div>`).join(''); }
const card = (id, span, title, sub, cls = '') => `<section class="card ${span} ${cls}"><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}<div class="chart" id="${id}"></div></section>`;
const tcard = (id, span, title, sub, ctrl = '') => `<section class="card ${span}"><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}${ctrl}<div class="tbl-wrap" id="${id}"></div></section>`;

function coursePool() {
  return D.courses.filter(r => (!sel.p.size || sel.p.has(r[CC.p])) && (!sel.d.size || sel.d.has(r[CC.d])) && (!sel.l.size || sel.l.has(r[CC.l]))

}

// generic heatmap over two dimensions (rows d1, columns d2) using any value function on the grouped measures
function heat2(id, d1, d2, val, fmtv, { cols = null, rows = null, min = null, max = null, colors = ['#f4f6fa', '#cfe3f7', '#7fb3e8', '#1976d2', '#0f327e'], log = false, minCount = () => true, tip = null, label = null } = {}) {
  const c = chartIn(id); if (!c) return;
  const g2 = group2(d1, d2), N1 = NAMES[d1], N2 = NAMES[d2];
  const rowsK = rows || [...new Set([...g2.keys()].map(k => +k.split('|')[0]))];
  const colsK = cols || [...new Set([...g2.keys()].map(k => +k.split('|')[1]))];
  const cells = [];
  rowsK.forEach((r, yi) => colsK.forEach((cc, xi) => { const o = g2.get(r + '|' + cc); if (!o || !minCount(o)) return; const v = val(o); if (v == null || !isFinite(v) || v <= 0 && log) return;
    cells.push({ value: [xi, yi, log ? Math.log10(v) : v], raw: v, r, cc, n: o.n }); }));
  if (!cells.length) { c.clear(); c.setOption({ title: { text: 'No data for this selection', left: 'center', top: 'middle', textStyle: { color: '#8790a6', fontSize: 12, fontWeight: 400 } } }); return; }
  const vs = cells.map(x => x.value[2]), lo = min ?? Math.min(...vs), hi = max ?? Math.max(...vs);
  c.getDom().style.minHeight = Math.max(380, 26 * rowsK.length + 110) + 'px'; c.resize();
  cells.forEach(x => { const t = (x.value[2] - lo) / ((hi - lo) || 1); x.label = { color: t > .62 ? '#ffffff' : '#1d2a44' }; });
  c.setOption({ animationDuration: 300, grid: { left: 232, right: 12, top: 78, bottom: 8, containLabel: false },
    tooltip: { ...TIP, formatter: p => `<b>${esc(N1[p.data.r])}</b> · ${esc(N2[p.data.cc])}<br>${fmtv(p.data.raw)}` + (tip ? tip(p.data) : '') + `<br>${nf(p.data.n)} courses` },
    xAxis: { type: 'category', data: colsK.map(k => N2[k]), position: 'top', ...AX, axisLabel: { ...AX.axisLabel, rotate: 40, interval: 0 }, splitArea: { show: false } },
    yAxis: { type: 'category', data: rowsK.map(k => N1[k]), inverse: true, ...AX, axisLabel: { ...AX.axisLabel, interval: 0, width: 220, overflow: 'truncate' } },
    visualMap: { show: false, min: lo, max: hi, inRange: { color: colors } },
    series: [{ type: 'heatmap', data: cells, label: { show: true, fontSize: 10, formatter: p => label ? label(p.data.raw) : fmtv(p.data.raw) }, itemStyle: { borderColor: '#fff', borderWidth: 2 }, emphasis: { itemStyle: { borderColor: '#0c2253', borderWidth: 2 } } }] }, true);
  c.off('click'); c.on('click', p => { if (!p.data) return; sel[d1].clear(); sel[d2].clear(); sel[d1].add(p.data.r); sel[d2].add(p.data.cc); update(); });
}
// bars over a fixed list of categories (formats, rating bands ...): items = [{name, v, tip}]
function catBars(id, items, fmtv, color, { sort = true, vertical = false } = {}) {

  if (rank === 'gain') { gainTable('cs-tbl', n); $('#cs-note').textContent = D.changes ? `Enrolments gained since ${D.changes.prevLabel}, same courses in both weeks.` : 'No earlier week to compare with.'; return; }
  const f = { enr: r => r[CC.enr], new: r => (r[CC.age] != null && r[CC.age] <= 90 && r[CC.vel] != null) ? r[CC.vel] : null,
    new6: r => (r[CC.age] != null && r[CC.age] <= 182 && r[CC.vel] != null) ? r[CC.vel] : null,
    new9: r => (r[CC.age] != null && r[CC.age] <= 273 && r[CC.vel] != null) ? r[CC.vel] : null, rev: r => r[CC.rev], revenue: r => r[CC.revenue] || null,
    rating: r => (r[CC.rev] || 0) >= 50 ? r[CC.rating] : null, low: r => (r[CC.rev] || 0) >= 50 ? -r[CC.rating] : null }[rank];
  const list = coursePool().filter(r => f(r) != null).sort((a, b) => f(b) - f(a) || (b[CC.rev] || 0) - (a[CC.rev] || 0)).slice(0, n);
  const sortK = { enr: 'enr', new: 'vel', new6: 'vel', new9: 'vel', rev: 'rev', revenue: 'revenue', rating: 'rating', low: 'rating' }[rank];
  const extra = [{ k: 'prov', label: 'Provider', v: r => r[CC.provider], f: r => esc(r[CC.provider]) }];
  if (NEW) extra.push({ k: 'launch', label: 'Launched on', v: r => -r[CC.age], f: r => new Date(Date.parse(D.asOfISO) - r[CC.age] * 864e5).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) },
    { k: 'age', label: 'Days since launch', r: 1, v: r => r[CC.age], f: r => nf(r[CC.age]) },
    { k: 'daily', label: 'Daily learners', r: 1, v: r => r[CC.enr] != null ? r[CC.enr] / Math.max(r[CC.age], 1) : null, f: r => r[CC.enr] != null ? cmp(r[CC.enr] / Math.max(r[CC.age], 1)) : '–' },   // enrolments / days since launch (day of launch counts as 1)
    { k: 'vel', label: 'Learners per month', r: 1, v: r => r[CC.vel], f: r => cmp(r[CC.vel]) });
  $('#cs-note').textContent = NEW ? `${list.length} courses launched in the last ${NEW[1]} months, fastest-growing first (learners gained per month since launch).` : `${list.length} courses`;
  if (!tblSort['cs-tbl']) tblSort['cs-tbl'] = { k: sortK, asc: rank === 'low' };
  const cols = courseCols(extra).filter(c => !NEW || !['rev', 'rating', 'year'].includes(c.k));   // new-course rankings: no reviews, rating or year
  table('cs-tbl', [{ k: 'rank', label: '#', r: 1, v: r => list.indexOf(r) + 1, f: r => list.indexOf(r) + 1 }, ...cols], list, { sortK, limit: n });
}

// ============================================================ boot
$('#asOf').textContent = D.weekLabel;
let h = (location.hash || '').slice(1); if (h === 'topics') h = 'domains'; if (PAGES.some(p => p.id === h)) PAGE = h;
if (INIT) { if (INIT.page && PAGES.some(p => p.id === INIT.page)) PAGE = INIT.page; for (const [k, v] of Object.entries(INIT.sel || {})) if (sel[k]) v.forEach(x => sel[k].add(x)); }
{ const ws = $('#weekSel'); ws.innerHTML = window.__WEEKS.map(w => `<option value="${w.id}" ${w.id === window.__WEEK ? 'selected' : ''}>${esc(w.label)}</option>`).join('');
  ws.onchange = () => window.__switchWeek(ws.value, { page: PAGE, sel: Object.fromEntries(Object.entries(sel).map(([k, s]) => [k, [...s]])) }); }
window.__disposeCharts = () => { charts.forEach(c => c.dispose()); charts.clear(); };
renderSlicers(); renderPage(true);
// handles for checking the report from the browser console
Object.assign(window, { D, sel, PAGES, charts, total, group, toggle, update, renderPage, coursePool, CC, M, usd, cmp, cache, topicAgg, setPage: p => { PAGE = p; renderPage(true); } });
};
async function decodeB64Gzip(b64) {
  const bin = atob(b64.trim()), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
window.__WEEKS = JSON.parse(document.getElementById('weeks').textContent);
window.__weekCache = {};
async function loadWeek(id) {
  if (window.__weekCache[id]) return window.__weekCache[id];
  const w = window.__WEEKS.find(x => x.id === id) || window.__WEEKS[0];
  let b64;
  if (w.inline) b64 = document.getElementById('data').textContent;
  else { const r = await fetch(w.file); if (!r.ok) throw new Error('Could not load ' + w.file); b64 = await r.text(); }
  return (window.__weekCache[w.id] = await decodeB64Gzip(b64));
}
window.__switchWeek = async (id, state) => {
  const el = document.getElementById('loading') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'loading' }));
  el.setAttribute('style', 'position:fixed;inset:0;display:grid;place-items:center;background:rgba(238,241,246,.92);color:#0f327e;font:600 14px var(--font);z-index:50');
  el.textContent = 'Loading week…';
  try {
    const data = await loadWeek(id);
    if (window.__disposeCharts) window.__disposeCharts();
    const sl = document.getElementById('slicers'); sl.replaceWith(sl.cloneNode(false));   // drop the old week's listeners
    document.getElementById('canvas').innerHTML = ''; document.getElementById('canvas').dataset.page = '';
    window.__WEEK = id; window.__app(data, state);
    el.remove();
  } catch (e) {
    el.innerHTML = `<div style="max-width:520px;text-align:center;line-height:1.5">That week couldn't be loaded (${e.message}). Earlier weeks load from the website, so they aren't available when the report file is opened offline.<br><button type="button" style="margin-top:10px" onclick="this.closest('#loading').remove(); document.getElementById('weekSel').value = window.__WEEK">Back to ${window.__WEEK}</button></div>`;
  }
};
(async () => {
  const el = document.getElementById('loading');
  try {
    const latest = window.__WEEKS[0].id;
    window.__WEEK = latest;
    window.__app(await loadWeek(latest));
    el.remove();
  } catch (e) {
    el.textContent = 'This report needs a current browser (Chrome, Edge, Firefox or Safari 16.4+). ' + e.message;
  }
})()
